[project]
name = "agentic-consumer"
version = "0.1.0"
description = "Kafka -> PostgreSQL + pgvector consumer for agentic capture events"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "kafka-python==2.2.15",
  "psycopg[binary]==3.2.9",
  "pgvector==0.3.5",
  "sentence-transformers==3.0.1",
  "einops==0.8.2",
  "numpy==2.0.2",
  "scikit-learn==1.5.1",
]

[project.scripts]
consumer-run = "consumer.main:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["consumer"]

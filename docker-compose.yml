version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: agentic
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redpanda:
    image: redpandadata/redpanda:v24.2.8
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - "1G"
      - --reserve-memory
      - "0M"
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr
      - internal://0.0.0.0:8083
      - --advertise-pandaproxy-addr
      - internal://redpanda:8083
    ports:
      - "19092:19092"
      - "9644:9644"

  kafka-bridge:
    build:
      context: ./sidecar/kafka-bridge
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      KAFKA_TOPIC: envoy.capture.events
      EVENT_QUEUE_SIZE: "10000"
      LOG_LEVEL: INFO
    ports:
      - "8082:8082"
    depends_on:
      - redpanda

  consumer:
    build:
      context: ./consumer
    restart: unless-stopped
    environment:
      MIGRATIONS_DIR: /app/migrations
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      KAFKA_TOPIC: envoy.capture.events
      KAFKA_GROUP_ID: agentic-consumer
      POSTGRES_DSN: postgresql://postgres:postgres@postgres:5432/agentic
      EMBED_MODEL_NAME: nomic-ai/nomic-embed-text-v1
      EMBED_BATCH_SIZE: "32"
      DB_BATCH_SIZE: "256"
    volumes:
      - ./scripts:/app/scripts:ro
      - ./data:/app/data:ro
    depends_on:
      - redpanda
      - postgres

volumes:
  pgdata:

[project]
name = "agentic-detector"
version = "0.1.0"
description = "Cron-style drift detector: nightly baseline + online session scoring, writes drift_events"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "psycopg[binary]==3.2.9",
  "pgvector==0.3.5",
  "numpy==2.0.2",
  "APScheduler==3.10.4",
  "scikit-learn==1.5.1",
]

[project.scripts]
detector-run = "detector.scheduler:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["detector"]

apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyExtensionPolicy
metadata:
  name: grpc-inspection-policy
  namespace: llmg
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: prod-routes
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: openrouter
  extProc:
    - backendRefs:
        - name: grpc-inspection-service
          port: 9000
      processingMode:
        request:
          body: Buffered
        response:
          body: Streamed
      messageTimeout: 500ms
      failOpen: false
